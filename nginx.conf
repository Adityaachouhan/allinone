# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Multi-Tenant Grocery SaaS
# Access via: http://72.60.222.141:9099
#
# Paths on VPS:
#   /allinone/dist             → Tenant Storefront build   (npm run build)
#   /allinone/dist-superadmin  → Super Admin build         (cd super-admin && npm run build)
#
# URL routing:
#   http://72.60.222.141:9099/              → Tenant Storefront
#   http://72.60.222.141:9099/api/*         → Express Tenant API (port 9095)
#   http://72.60.222.141:9099/superadmin    → Super Admin Dashboard
#   http://72.60.222.141:9099/superadmin/api/* → Express Super Admin API (port 9095)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 9099;
    listen [::]:9099;

    server_name 72.60.222.141 _;

    # ── Super Admin API — MUST come before /superadmin static block ──────────
    location /superadmin/api/ {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Super Admin Dashboard — /allinone/dist-superadmin ────────────────────
    location /superadmin {
        alias   /allinone/dist-superadmin;
        index   index.html;
        try_files $uri $uri/ /allinone/dist-superadmin/index.html;
    }

    # ── Tenant API — proxy to Express ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Tenant Storefront — /allinone/dist ───────────────────────────────────
    location / {
        root      /allinone/dist;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}

