# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Multi-Tenant Grocery SaaS
# Access via: http://72.60.222.141:9099
#
# Paths on VPS:
#   /root/allinone/dist             → Tenant Storefront build   (npm run build)
#   /root/allinone/dist-superadmin  → Super Admin build         (cd super-admin && npm run build)
#
# URL routing:
#   http://72.60.222.141:9099/              → Tenant Storefront (default)
#   http://72.60.222.141:9099/api/*         → Express Tenant API (port 9095)
#   http://72.60.222.141:9099/superadmin/   → Super Admin Dashboard
#   http://72.60.222.141:9099/superadmin/api/* → Express Super Admin API
#
# Per-shop port routing (no domain needed):
#   http://72.60.222.141:9100  → Shop 1 (domain stored in DB: "72.60.222.141:9100")
#   http://72.60.222.141:9111  → Shop 2 (domain stored in DB: "72.60.222.141:9111")
# ─────────────────────────────────────────────────────────────────────────────

# ── Super Admin + Default server block ───────────────────────────────────────
server {
    listen 9099;
    listen [::]:9099;

    server_name 72.60.222.141 _;

    # ── Super Admin API — MUST come before /superadmin static block ──────────
    location /superadmin/api/ {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Super Admin Dashboard ─────────────────────────────────────────────────
    location /superadmin/ {
        alias   /root/allinone/dist-superadmin/;
        index   index.html;
        try_files $uri $uri/ /superadmin/index.html;
    }

    location = /superadmin {
        return 301 /superadmin/;
    }

    # ── Tenant API — proxy to Express ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # ── SSE Admin Notifications — disable nginx buffering ────────────────────
    # Without this block, nginx buffers the SSE stream and real-time
    # notifications never reach the admin browser.
    location /api/admin/notifications/stream {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── Uploaded images — served directly from disk ───────────────────────────
    location /uploads/ {
        alias /root/allinone/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Dynamic PWA endpoints — forward to Express ─────────────────────────────
    location = /manifest.webmanifest {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Tenant Storefront ─────────────────────────────────────────────────────
    location / {
        root      /root/allinone/dist;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ── SHOP TEMPLATE — copy this block for each new shop ────────────────────────
# Replace 9100 with the shop's port and register the same "72.60.222.141:9100"
# as the domain when onboarding the shop in the Super Admin panel.
#
# To add Shop 1:
#   1. Copy the block below, change port to 9100
#   2. Open firewall: sudo ufw allow 9100
#   3. Reload nginx: sudo systemctl reload nginx
#   4. In Super Admin → Onboard Shop → Domain: 72.60.222.141:9100
#
# server {
#     listen 9100;
#     listen [::]:9100;
#     server_name _;
#
#     location / {
#         proxy_pass         http://127.0.0.1:9095;
#         proxy_http_version 1.1;
#         proxy_set_header   Host              $host:$server_port;
#         proxy_set_header   X-Real-IP         $remote_addr;
#         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header   X-Forwarded-Proto $scheme;
#     }
# }

# ── Shop 1 — uncomment and customize ─────────────────────────────────────────
server {
    listen 9100;
    listen [::]:9100;
    server_name _;

    # ── SSE Admin Notifications — MUST come before the generic location / ──
    # proxy_buffering off is REQUIRED for real-time SSE to work through nginx.
    location /api/admin/notifications/stream {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host:$server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass         http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host:$server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

