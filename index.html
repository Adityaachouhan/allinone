<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA: Dynamic manifest served by Express per tenant -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home screen icon (served dynamically with safe-zone padding to prevent edge cutting) -->
    <link rel="apple-touch-icon" href="/api/pwa-icon-adaptive?size=180" />

    <!-- Viewport & theme: disable pinch-to-zoom & double-tap zoom for app-like responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <!-- Early theme synchronization: applies cached theme color & CSS variables instantly on page load (even offline) -->
    <script>
      (function() {
        try {
          var color = localStorage.getItem('aio_store_theme_color');
          if (!color) {
            var raw = localStorage.getItem('aio_store_settings');
            if (raw) {
              var s = JSON.parse(raw);
              if (s && s.theme_color) color = s.theme_color;
            }
          }
          if (color && /^#[0-9a-fA-F]{3,6}$/.test(color)) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', color);
            var clean = color.replace('#', '').trim();
            if (clean.length === 3) clean = clean.split('').map(function(c) { return c + c; }).join('');
            if (clean.length === 6) {
              var n = parseInt(clean, 16);
              var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
              var r1 = r / 255, g1 = g / 255, b1 = b / 255;
              var max = Math.max(r1, g1, b1), min = Math.min(r1, g1, b1);
              var h = 0, s = 0, l = (max + min) / 2;
              if (max !== min) {
                var d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (max === r1) h = (g1 - b1) / d + (g1 < b1 ? 6 : 0);
                else if (max === g1) h = (b1 - r1) / d + 2;
                else h = (r1 - g1) / d + 4;
                h = Math.round(h * 60);
              }
              s = Math.round(s * 100); l = Math.round(l * 100);
              var root = document.documentElement;
              root.style.setProperty('--color-primary-50', 'hsl(' + h + ', ' + Math.min(s, 95) + '%, 96%)');
              root.style.setProperty('--color-primary-100', 'hsl(' + h + ', ' + Math.min(s, 90) + '%, 91%)');
              root.style.setProperty('--color-primary-200', 'hsl(' + h + ', ' + Math.min(s, 85) + '%, 82%)');
              root.style.setProperty('--color-primary-300', 'hsl(' + h + ', ' + Math.min(s, 80) + '%, 70%)');
              root.style.setProperty('--color-primary-400', 'hsl(' + h + ', ' + Math.min(s, 75) + '%, 58%)');
              root.style.setProperty('--color-primary-500', 'hsl(' + h + ', ' + Math.min(s, 75) + '%, 48%)');
              root.style.setProperty('--color-primary-600', color);
              root.style.setProperty('--color-primary-700', 'hsl(' + h + ', ' + Math.min(s, 80) + '%, ' + Math.max(l - 9, 18) + '%)');
              root.style.setProperty('--color-primary-800', 'hsl(' + h + ', ' + Math.min(s, 85) + '%, ' + Math.max(l - 17, 12) + '%)');
              root.style.setProperty('--color-primary-900', 'hsl(' + h + ', ' + Math.min(s, 90) + '%, ' + Math.max(l - 24, 8) + '%)');
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Disable pinch-to-zoom and multi-touch gestures -->
    <script>
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>

    <!-- iOS PWA settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grocery" />

    <!-- Android / general PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Grocery Mart" />

    <!-- SEO -->
    <meta name="description" content="Your local grocery mart online. Fresh fruits, vegetables, dairy, staples and more, delivered to your door." />
    <title>Grocery Mart</title>
    <meta property="og:title" content="Grocery Mart" />
    <meta property="og:description" content="Fresh groceries delivered to your door. Order online." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register the dynamic per-tenant service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[PWA] Service Worker registered, scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
